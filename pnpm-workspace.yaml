packages:
  - .

allowBuilds:
  esbuild: false
  pnpm: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.17.0
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0

overrides:
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  semver: '>=7'
  minimatch: '>=11.0.1'

publishBranch: main

strictPeerDependencies: false

trustPolicy: no-downgrade
