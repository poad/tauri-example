[advisories]
# glib 0.18.5 unsoundness in VariantStrIter (GHSA-wrw7-89jp-8q8g)
# This is a transitive dependency of webkit2gtk (via wry) on Linux,
# which requires GTK3 (gtk-rs v0.18). The GTK3 Rust bindings are
# unmaintained and cannot be upgraded to use glib >= 0.20.
# Upstream tracking: https://github.com/tauri-apps/tauri/issues/12561
# Risk assessment: VariantStrIter is not used in Tauri's Linux code paths.
ignore = [
    # glib 0.18.5 unsoundness in VariantStrIter
    "RUSTSEC-2024-0429",
    # gtk-rs GTK3 bindings are no longer maintained (atk)
    "RUSTSEC-2024-0411",
    # gtk-rs GTK3 bindings are no longer maintained (gdk)
    "RUSTSEC-2024-0412",
